<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/fontis_favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Fontis - Freies Archivinformationssystem (AFIS)" />
  <meta name="theme-color" content="#f8fafc" />
  <title>Fontis – Freies Archivsystem</title>
  <script>
    (function() {
      var isFunctional = false;
      try {
        if (typeof window !== 'undefined' && window.localStorage) {
          window.localStorage.setItem('__test__', '1');
          window.localStorage.removeItem('__test__');
          isFunctional = true;
        }
      } catch (e) {
        isFunctional = false;
      }

      if (!isFunctional) {
        var _store = {};
        var mockStorage = {
          getItem: function(k) { return Object.prototype.hasOwnProperty.call(_store, k) ? _store[k] : null; },
          setItem: function(k, v) { _store[k] = String(v); },
          removeItem: function(k) { delete _store[k]; },
          clear: function() { _store = {}; },
          key: function(i) { return Object.keys(_store)[i] || null; },
          get length() { return Object.keys(_store).length; }
        };

        try {
          Object.defineProperty(window, 'localStorage', {
            configurable: true,
            enumerable: true,
            get: function() { return mockStorage; },
            set: function() {}
          });
        } catch(err1) {
          try {
            Object.defineProperty(Object.getPrototypeOf(window), 'localStorage', {
              configurable: true,
              enumerable: true,
              get: function() { return mockStorage; },
              set: function() {}
            });
          } catch(err2) {
            try { window.localStorage = mockStorage; } catch(err3) {}
          }
        }
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
